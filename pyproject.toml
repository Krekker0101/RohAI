[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "smart-traffic-ai"
version = "0.1.0"
description = "Deterministic intersection simulation and safety-first adaptive control"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
vision = ["ultralytics>=8.4.63,<8.5", "opencv-python>=4.12,<5", "numpy>=2,<3", "lap>=0.5.12,<0.6"]
maket = ["pyserial==3.5"]
pilot = ["transformers>=4.57,<6", "safetensors>=0.6,<1", "piper-tts==1.8.0", "torch==2.14.0", "numpy>=2,<3"]
road-segmentation = ["transformers>=4.57,<6", "safetensors>=0.6,<1"]
learning = ["gymnasium>=1.3,<1.4", "numpy>=2,<3"]
control-training = ["gymnasium>=1.3,<1.4", "numpy>=2,<3", "stable-baselines3==2.9.0"]

[project.scripts]
rohai = "traffic_vision.cli:main"
rohai-sim = "traffic_simulator.twin_cli:main"

[dependency-groups]
dev = ["pytest>=8.3,<10", "httpx>=0.28,<1", "ruff>=0.11,<1", "mypy>=1.15,<2"]

[tool.hatch.build.targets.wheel]
packages = ["apps/backend/src/smart_traffic_backend", "packages/traffic_core/src/traffic_core", "packages/simulator/src/traffic_simulator", "packages/vision/src/traffic_vision"]

[tool.uv]
constraint-dependencies = ["urllib3>=2.8.0,<3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".uv-cache", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["apps/backend/src", "packages", "tests", "scripts"]
