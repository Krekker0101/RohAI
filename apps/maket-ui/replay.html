<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RohAI — Replay</title><style>
:root{color-scheme:dark;font:16px system-ui;background:#0b1120;color:#e9eef5}body{max-width:1100px;margin:auto;padding:24px}a{color:#65e7bd}button,input,select{font:inherit;padding:10px;background:#19263b;color:inherit;border:1px solid #526783;border-radius:8px}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #65e7bd;outline-offset:3px}label{display:inline-flex;align-items:center;gap:8px;margin:8px}#scrub{width:100%}img{display:block;max-width:100%;max-height:55vh;margin:20px auto}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#111d2e;padding:16px;border-radius:12px}#events{font-variant-numeric:tabular-nums}#status{line-height:1.5}
</style></head><body><a href="/maket">← RohAI</a><h1>REPLAY · физическое исполнение отключено</h1><p>Записанные предсказания не являются проверенной разметкой. Историческое ACK не подтверждает свечение ламп. Команды ESP32 здесь не отправляются.</p><p id="status" role="status" aria-live="polite">Загружаем историю…</p><button id="play" disabled>Воспроизвести</button><button id="pause">Пауза</button><button id="previous">Предыдущая часть</button><button id="next">Следующая часть</button><label>Скорость <select id="speed"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option><option value="4">4×</option></select></label><label for="scrub">Позиция в текущей части (до 200 событий)</label><input id="scrub" type="range" min="0" max="0" value="0"><p id="position"></p><img id="frame" alt="Записанный кадр камеры" hidden><h2>Состояние и причинная последовательность</h2><pre id="state">Нет записанных данных</pre><pre id="events"></pre><script>
const $=id=>document.getElementById(id),id=location.pathname.match(/^\/maket\/replay\/([a-f0-9]{32})$/)?.[1],base=id?'/api/maket/replay/'+id:'';
let data=[],offset=0,next=null,index=0,playing=false,anchor=0,started=0,loading=false,frameBusy=false,wantedFrame=null,shownFrame=null,frameUrl=null;
async function load(at){if(loading)return;loading=true;playing=false;try{const r=await fetch(base+'/timeline?offset='+at+'&limit=200',{credentials:'same-origin'});if(!r.ok)throw Error('История недоступна. Вернитесь в RohAI и восстановите локальное подключение.');const chunk=await r.json();if(chunk.physical_execution!==false||chunk.mode!=='REPLAY')throw Error('Недопустимый режим replay');data=chunk.events;offset=at;next=chunk.next_offset;index=0;$('status').textContent=chunk.complete?'Полная запись · REPLAY':'НЕПОЛНАЯ запись — возможны пропуски или незавершённый сеанс';$('scrub').max=Math.max(0,data.length-1);$('play').disabled=!data.length;$('previous').disabled=at===0;$('next').disabled=next===null;show();}catch(e){$('status').textContent=e.message;}finally{loading=false;}}
function show(){const e=data[index];if(!e)return;$('scrub').value=index;$('position').textContent=`Событие ${e.sequence} · ${(e.offset_ms/1000).toFixed(2)} с · ${e.timing_kind}`;$('events').textContent=data.slice(Math.max(0,index-7),index+1).map(v=>`#${v.sequence} ${(v.offset_ms/1000).toFixed(2)} с ${v.kind}${v.missing_before?' · ПРОПУЩЕНО '+v.missing_before:''}`).join('\n');let telemetry=null,frame=null;for(let i=index;i>=0;i--){if(!telemetry&&data[i].kind==='telemetry')telemetry=data[i].payload;if(frame===null&&data[i].kind==='recorded_frame')frame=data[i].payload.recorded_video_index;if(telemetry&&frame!==null)break;}$('state').textContent=JSON.stringify(telemetry?{mode:'REPLAY',historical_mode:telemetry.mode,traffic:telemetry.traffic,decision:telemetry.proposed,safety:telemetry.failure,hardware:telemetry.hardware,kpi:telemetry.maket_metrics}:e.payload,null,2);wantedFrame=frame;if(frame===null){$('frame').hidden=true;}else drawFrame();}
async function drawFrame(){if(frameBusy||wantedFrame===shownFrame||wantedFrame===null)return;const requested=wantedFrame;frameBusy=true;try{const r=await fetch(base+'/frame/'+requested,{credentials:'same-origin'});if(r.ok){const blob=await r.blob();if(wantedFrame===requested){if(frameUrl)URL.revokeObjectURL(frameUrl);frameUrl=URL.createObjectURL(blob);$('frame').src=frameUrl;$('frame').hidden=false;shownFrame=requested;}}}catch{$('status').textContent='Записанный кадр недоступен; история событий сохранена.';}finally{frameBusy=false;if(wantedFrame!==requested)drawFrame();}}
function resume(){if(!data.length)return;anchor=data[index].offset_ms;started=performance.now();playing=true;}
$('play').onclick=resume;$('pause').onclick=()=>playing=false;$('speed').onchange=()=>{if(playing)resume();};$('scrub').oninput=()=>{playing=false;index=Number($('scrub').value);show();};$('previous').onclick=()=>load(Math.max(0,offset-200));$('next').onclick=()=>{if(next!==null)load(next);};
function tick(now){if(playing&&!loading){const target=anchor+(now-started)*Number($('speed').value);let changed=false;while(index+1<data.length&&data[index+1].offset_ms<=target){index++;changed=true;}if(changed)show();if(index===data.length-1&&target>=data[index].offset_ms){playing=false;if(next!==null){const previousEnd=data[index].offset_ms,previousStart=started,previousAnchor=anchor;load(next).then(()=>{if(!data.length)return;anchor=previousAnchor;started=previousStart;playing=true;if(data[0].offset_ms<previousEnd)playing=false;});}}}requestAnimationFrame(tick);}requestAnimationFrame(tick);load(0);
window.addEventListener('pagehide',()=>{playing=false;if(frameUrl)URL.revokeObjectURL(frameUrl);});
</script></body></html>
