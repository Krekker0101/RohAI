<!doctype html><html lang="ru"><meta charset="utf-8"><title>RohAI recorded review</title><body style="background:#101827;color:#eee;font:18px system-ui;padding:24px"><h1>VIDEO_REPLAY — physical outputs disabled</h1><p>Recorded predictions are not verified ground truth or live control evidence.</p><label>Recorded frame <input id="index" type="number" min="0" value="0"></label><button id="show">Show</button><img id="frame" style="display:block;max-width:90vw;margin:20px 0" alt="Recorded frame"><pre id="events" style="white-space:pre-wrap"></pre><script>
document.getElementById('show').onclick=()=>document.getElementById('frame').src='/frame/'+document.getElementById('index').value;
fetch('/events').then(r=>r.text()).then(t=>document.getElementById('events').textContent=t).catch(e=>document.getElementById('events').textContent=e.message);
</script></body></html>
