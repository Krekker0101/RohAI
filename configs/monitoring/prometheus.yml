global:
  scrape_interval: 15s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: rohai
    metrics_path: /api/v1/operations/metrics
    static_configs:
      - targets: ['host.docker.internal:8000']
    http_headers:
      X-Operator-Token:
        files: ['/run/secrets/rohai_operator_token']
